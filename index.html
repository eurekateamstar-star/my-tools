<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1121">
    <title>海山救護</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --bg-color: #0b1121; 
            --text-color: #ffffff;
            --header-height: 50px;
        }

        /* ★★★ 核心修正 1：改用 dvh (動態高度) 填滿螢幕 ★★★ */
        html, body {
            position: fixed; /* 鎖死，禁止滑動 */
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;      /* 舊瀏覽器相容 */
            height: 100dvh;     /* 新技術：動態高度，解決黑邊 */
            overflow: hidden;   /* 禁止溢出 */
            background-color: var(--bg-color); /* 預設底色 */
            margin: 0; padding: 0;
            overscroll-behavior: none;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 0;
        }

        /* ★★★ 核心修正 2：主選單內容區 ★★★ */
        #main-content {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            
            /* 讓內容高度也能適應動態變化 */
            height: 100dvh; 
            
            overflow-y: auto; /* 允許上下滾動 */
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            
            /* 確保內容不會被切掉，也不會有額外黑邊 */
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); /* 底部安全距離 */
            
            box-sizing: border-box; /* 確保 padding 包含在高度內 */
            opacity: 0; 
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        /* 鎖定畫面 */
        #lock-screen {
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100dvh;
            background-color: #0b1121; z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s ease; padding: 20px; text-align: center;
        }

        .loading-spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #3b82f6; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        
        .status-text { font-size: 16px; color: #94a3b8; font-weight: 500; }
        .error-id { 
            margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1); 
            border-radius: 8px; font-family: monospace; user-select: text; 
            color: #f87171; border: 1px dashed #f87171;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 歡迎詞 */
        .user-welcome {
            font-size: 24px; color: #ffffff; font-weight: 700;
            margin-bottom: 20px; margin-top: 10px; padding-left: 5px;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .category-title {
            font-size: 18px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px; margin-top: 5px; padding-left: 8px;
            border-left: 3px solid #3b82f6; line-height: 1;
        }

        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            row-gap: 32px; column-gap: 12px; margin-bottom: 45px;
        }

        .app-item {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; position: relative; cursor: pointer;
        }

        .app-icon {
            width: 68px; height: 68px; border-radius: 18px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 28px; position: relative; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1); border-top: 1px solid rgba(255,255,255,0.25);
            transition: transform 0.2s;
        }
        .app-icon::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
        }
        .app-item:active .app-icon { transform: scale(0.9); filter: brightness(1.1); }

        .app-name {
            font-size: 12px; color: #cbd5e1; text-align: center; width: 80px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.4; font-weight: 500;
        }

        /* 配色 */
        .bg-medical { background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%); }
        .bg-record { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-check { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .bg-exam { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        .bg-google { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bg-ai { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .bg-map { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .bg-schedule { background: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%); }
        .bg-training { background: linear-gradient(135deg, #00B4DB 0%, #0083B0 100%); }
        .bg-book { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); }
        .bg-skill { background: linear-gradient(135deg, #FF512F 0%, #F09819 100%); }

        /* ★★★ 核心修正 3：視窗容器絕對滿版，無死角 ★★★ */
        #web-viewer {
            position: fixed; 
            top: 0; left: 0; bottom: 0; right: 0; /* 四邊鎖死 */
            width: 100vw; 
            height: 100dvh; /* 動態高度，確保蓋住底部 */
            
            z-index: 1000; 
            display: none; 
            flex-direction: column;
            background-color: #ffffff; /* 白底 */
            overscroll-behavior: none;
            
            /* 確保沒有任何 padding 導致黑底露出 */
            padding: 0; 
            margin: 0;
        }

        #nav-header { display: none !important; }

        /* 懸浮關閉按鈕 (top: 60px) */
        #float-close-btn {
            display: none; position: absolute;
            top: 60px; right: 20px;
            width: 36px; height: 36px; background: rgba(0,0,0,0.5);
            border-radius: 50%; color: white;
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px); z-index: 3000;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }

        /* Iframe 修正：高度 100%，強制區塊顯示 */
        .app-frame {
            width: 100%; 
            height: 100%; 
            border: none; 
            display: none; 
            display: none;
        }
        /* 只有當 active 時才顯示為 block，填滿父容器 */
        .app-frame.active { 
            display: block; 
            height: 100%;
        }

    </style>
</head>
<body>

<!-- 鎖定畫面 -->
<div id="lock-screen">
    <div class="loading-spinner" id="spinner"></div>
    <div class="status-text" id="status-text">系統驗證中...</div>
    <button id="reset-btn" onclick="forceReset()" style="display:none; margin-top:20px; padding:10px 20px; background:#ef4444; color:white; border:none; border-radius:50px; font-weight:bold; cursor:pointer;">
        <i class="fa-solid fa-rotate-right"></i> 重置系統
    </button>
</div>

<!-- ★★★ 主內容區 ★★★ -->
<div id="main-content">
    <div id="user-display" class="user-welcome"></div>
    <div class="category-title">EMS 核心系統</div>

    <div class="app-grid">
        <div class="app-item" onclick="openApp('智慧平台', 'https://script.google.com/macros/s/AKfycbyLGjirgVZkmzKzWWQGzGMo3C8EQCZoc3Vl_Ka793XObKin9Hy-YCR6Mfp3OUFQaIYL/exec')">
            <div class="app-icon bg-medical"><i class="fa-solid fa-truck-medical"></i></div>
            <span class="app-name">智慧平台</span>
        </div>
        <div class="app-item" onclick="openApp('協勤記錄', 'https://script.google.com/macros/s/AKfycby2sK2oLidlSoDQkrBexbS_geFJrHZy-Vw99fONEXcB3jDbRc48B4p6u4uo-DK6Qmcf/exec')">
            <div class="app-icon bg-record"><i class="fa-solid fa-file-signature"></i></div>
            <span class="app-name">協勤記錄</span>
        </div>
        <div class="app-item" onclick="openApp('點班系統', 'https://script.google.com/macros/s/AKfycbzFy5cWirymP-7oQh8ZsuNS-9RdQy0fZkk3j4W8_Ib_OXokksBreQeKz2h_kF7iAr73/exec')">
            <div class="app-icon bg-check"><i class="fa-solid fa-clipboard-check"></i></div>
            <span class="app-name">點班系統</span>
        </div>
        <div class="app-item" onclick="openApp('新人考核', 'https://script.google.com/macros/s/AKfycbwoO26nrnkPl53dnqbmky7Btct6l6O2Mj3-Tut9sccaW8OFVaJwYjhZxEbhJvhQDUF6yg/exec')">
            <div class="app-icon bg-exam"><i class="fa-solid fa-user-graduate"></i></div>
            <span class="app-name">新人考核</span>
        </div>
        <div class="app-item" onclick="openApp('常訓公佈欄', 'https://script.google.com/macros/s/AKfycbzKVXLlDys-Sx33LOWAHvjGo5CoBebzzVKmxgsXFqstoP-GR9uxxaJ45vRcqwTPZl5I/exec')">
            <div class="app-icon bg-training"><i class="fa-solid fa-bullhorn"></i></div>
            <span class="app-name">常訓公佈欄</span>
        </div>
        <a href="https://ebook.nfa.gov.tw/1140527/mobile/index.html" class="app-item" target="_blank">
            <div class="app-icon bg-book"><i class="fa-solid fa-book-medical"></i></div>
            <span class="app-name">救護手冊</span>
        </a>
        <a href="https://ebook.nfa.gov.tw/1140526/mobile/index.html" class="app-item" target="_blank">
            <div class="app-icon bg-skill"><i class="fa-solid fa-briefcase-medical"></i></div>
            <span class="app-name">單項技術</span>
        </a>
        <a href="https://docs.google.com/spreadsheets/d/1u-iyANnz3c8Vu_OathXEX8uqSPvbgWIQqghkbpPB-wU/edit?gid=157452443#gid=157452443" class="app-item" target="_blank">
            <div class="app-icon bg-schedule"><i class="fa-solid fa-table-list"></i></div>
            <span class="app-name">協勤表單</span>
        </a>
    </div> 
  
    <div class="category-title">常用工具</div>
    <div class="app-grid">
        <a href="https://www.google.com" class="app-item" target="_blank">
            <div class="app-icon bg-google"><i class="fa-brands fa-google"></i></div>
            <span class="app-name">Google</span>
        </a>
        <a href="https://chatgpt.com" class="app-item" target="_blank">
            <div class="app-icon bg-ai"><i class="fa-solid fa-robot"></i></div>
            <span class="app-name">ChatGPT</span>
        </a>
        <a href="https://www.google.com/maps" class="app-item" target="_blank">
            <div class="app-icon bg-map"><i class="fa-solid fa-map-location-dot"></i></div>
            <span class="app-name">地圖</span>
        </a>
    </div>
</div>

<!-- 全螢幕檢視器 -->
<div id="web-viewer">
    <!-- 懸浮關閉按鈕 -->
    <div id="float-close-btn" onclick="closeApp()">
        <i class="fa-solid fa-xmark"></i>
    </div>
    <iframe id="main-frame" class="app-frame" src="" allow="camera *; microphone *; geolocation *; fullscreen *; autoplay *; encrypted-media *; picture-in-picture *;"></iframe>
    <iframe id="temp-frame" class="app-frame" src="" allow="camera *; microphone *; geolocation *; fullscreen *; autoplay *; encrypted-media *; picture-in-picture *;"></iframe>
</div>

<script>
  // --- OneSignal ---
  const GITHUB_PAGE_URL = "https://eurekateamstar-star.github.io/my-tools/";
  function forceSubscribe() {
      if (window.self !== window.top) {
          alert("通知設定：即將開啟新視窗，請點擊「允許」！");
          window.open(GITHUB_PAGE_URL, "_blank");
      } else {
          if (typeof OneSignal !== 'undefined') OneSignal.Slidedown.promptPush();
          else { alert("載入中..."); location.reload(); }
      }
  }
  if (window.self === window.top) {
      var script = document.createElement('script');
      script.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
      script.defer = true;
      document.head.appendChild(script);
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
          appId: "f65a536b-1426-4f8c-a403-d2a94e29915b",
          path: "/my-tools/", 
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true,
        });
        OneSignal.Slidedown.promptPush();
      });
  }

  // --- 系統核心 ---
  const MY_LIFF_ID = "2008830494-0OA0heXb";
  const CHECK_API_URL = "https://script.google.com/macros/s/AKfycbzM_veXLJhRI5DmO3zd2Mraw_LSr08_9-TXN4gbNVuBmZpe1SOSf_rWciiUVqzjF8qO/exec"; 
  const MAIN_APP_URL = "https://script.google.com/macros/s/AKfycbyLGjirgVZkmzKzWWQGzGMo3C8EQCZoc3Vl_Ka793XObKin9Hy-YCR6Mfp3OUFQaIYL/exec";
  const MAIN_APP_ID_PART = "AKfycbyLGjirgVZkmzKzWWQGzGMo3C8EQCZoc3Vl_Ka793XObKin9Hy-YCR6Mfp3OUFQaIYL";

  window.onload = function() {
      // JS 強制修正：只有主選單可以滾動，其他全部禁止
      document.body.addEventListener('touchmove', function(e) {
          if (!e.target.closest('#main-content') && !e.target.closest('.app-frame')) {
              e.preventDefault();
          }
      }, { passive: false });

      setTimeout(() => {
          const resetBtn = document.getElementById('reset-btn');
          if(resetBtn && document.getElementById('lock-screen').style.display !== 'none') {
              resetBtn.style.display = 'block';
              document.getElementById('status-text').innerText = "連線似乎有問題...";
          }
      }, 3000);

      const isAuthorized = localStorage.getItem('isAuthorized') === 'true';
      const savedUid = localStorage.getItem('currentUserId');

      if (isAuthorized && savedUid && savedUid !== "null" && savedUid !== "undefined") {
          const savedName = localStorage.getItem('userName') || '';
          if(savedName) document.getElementById('user-display').innerText = "Hi, " + savedName;
          unlockScreen();
          preloadMainApp(savedUid);
      } else {
          initializeLiff();
      }
  };

  function preloadMainApp(userId) {
      const mainFrame = document.getElementById('main-frame');
      let targetUrl = MAIN_APP_URL;
      targetUrl += (targetUrl.includes('?') ? "&" : "?") + "uid=" + userId;
      mainFrame.src = targetUrl;
  }

  function openApp(title, url) {
      var viewer = document.getElementById('web-viewer');
      var mainFrame = document.getElementById('main-frame');
      var tempFrame = document.getElementById('temp-frame');
      var floatBtn = document.getElementById('float-close-btn');
      var userId = localStorage.getItem('currentUserId');
      var userName = localStorage.getItem('userName') || '';

      const isMainApp = url.includes(MAIN_APP_ID_PART);
      
      if (isMainApp) {
          mainFrame.classList.add('active');
          tempFrame.classList.remove('active');
      } else {
          mainFrame.classList.remove('active');
          tempFrame.classList.add('active');
          let finalUrl = url;
          if (userId && userId !== "null") {
              finalUrl += (finalUrl.includes('?') ? '&' : '?') + "uid=" + userId + "&name=" + encodeURIComponent(userName);
          }
          tempFrame.src = finalUrl;
      }

      floatBtn.style.display = 'flex';
      viewer.style.display = 'flex';
  }

  function closeApp() {
      var viewer = document.getElementById('web-viewer');
      var tempFrame = document.getElementById('temp-frame');
      var mainFrame = document.getElementById('main-frame');
      viewer.style.display = 'none'; 
      tempFrame.classList.remove('active');
      mainFrame.classList.remove('active');
      tempFrame.src = "about:blank";
  }

  function forceReset() {
      localStorage.clear();
      alert("系統已重置，將重新載入。");
      window.location.href = window.location.href.split('?')[0];
  }

  function initializeLiff() {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
          if (liff.isLoggedIn()) checkPermission(); else liff.login();
      }).catch(err => {
          console.error(err);
          document.getElementById('status-text').innerText = "初始化失敗";
          document.getElementById('reset-btn').style.display = 'block';
      });
  }

  function checkPermission() {
      document.getElementById('status-text').innerText = "正在確認權限...";
      liff.getProfile().then(profile => {
          const userId = profile.userId;
          fetch(CHECK_API_URL + "?userId=" + userId)
          .then(r => r.json())
          .then(data => {
              if (data.allowed) {
                  localStorage.setItem('isAuthorized', 'true');
                  localStorage.setItem('userName', data.name);
                  localStorage.setItem('currentUserId', userId); 
                  document.getElementById('user-display').innerText = "Hi, " + data.name;
                  unlockScreen();
                  preloadMainApp(userId);
              } else {
                  document.getElementById('spinner').style.display = 'none';
                  document.getElementById('status-text').innerHTML = "⚠️ 無權限<br>ID: <div class='error-id'>" + userId + "</div>";
                  document.getElementById('reset-btn').style.display = 'block';
              }
          })
          .catch(() => {
               document.getElementById('status-text').innerHTML = "連線錯誤";
               document.getElementById('reset-btn').style.display = 'block';
          });
      });
  }

  function unlockScreen() {
      const lockScreen = document.getElementById('lock-screen');
      const mainContent = document.getElementById('main-content');
      lockScreen.style.opacity = '0';
      mainContent.style.display = 'block';
      setTimeout(() => {
          lockScreen.style.display = 'none';
          mainContent.style.opacity = '1';
      }, 500);
  }
</script>
</body>
</html>
